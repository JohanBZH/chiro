name: "CI/CD Pipeline"

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  backend-test:
    name: "Backend: Build & Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore Chiro.App/Chiro.App.csproj && dotnet restore Chiro.Tests/Chiro.Tests.csproj


      - name: Build
        run: dotnet build --no-restore

      - name: Test
        # This will spin up PostGIS using Testcontainers (requires Docker, included on Ubuntu runners)
        run: dotnet test Chiro.Tests/Chiro.Tests.csproj --no-build --verbosity normal

  frontend-test:
    name: "Frontend: Build & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Chiro.Client
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './Chiro.Client/package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Run Tests
        run: npm test
